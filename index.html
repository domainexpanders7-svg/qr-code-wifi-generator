<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Free WiFi & URL QR Code Generator Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root{
        --bg:#0f0f0f;
        --glass:#ffffff0d;
        --glass-border:#ffffff1a;
        --accent:#00b4d8;
        --text:#e0e0e0;
        --shadow:0 8px 32px 0 rgba(0,0,0,0.37);
        --radius:15px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
        font-family:'Poppins',sans-serif;
        background:#111;
        color:var(--text);
        min-height:100vh;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:flex-start;
        background:radial-gradient(circle at 20% 20%,#111 0%,#000 70%);
    }
    h1{
        margin:2rem 0 1rem;
        font-weight:600;
        text-align:center;
        color:var(--accent);
    }
    .container{
        width:90%;
        max-width:480px;
        background:var(--glass);
        border-radius:var(--radius);
        border:1px solid var(--glass-border);
        backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);
        padding:2rem;
        box-shadow:var(--shadow);
        margin-bottom:2rem;
        display:flex;
        flex-direction:column;
        gap:1rem;
    }
    .input-group{
        display:flex;
        gap:0.5rem;
    }
    input[type=text]{
        flex:1;
        padding:0.75rem 1rem;
        border:none;
        border-radius:var(--radius);
        background:rgba(255,255,255,0.1);
        color:var(--text);
        font-size:1rem;
    }
    input[type=text]::placeholder{
        color:#aaa;
    }
    button{
        padding:0.75rem 1.5rem;
        border:none;
        border-radius:var(--radius);
        background:var(--accent);
        color:#fff;
        font-weight:600;
        cursor:pointer;
        transition:background .3s, transform .2s;
    }
    button:hover{background:#0096c7;}
    button:active{transform:scale(0.97);}
    #qr-output{
        display:flex;
        justify-content:center;
        margin-top:1rem;
    }
    #qr-canvas{
        border-radius:var(--radius);
        background:#fff;
        padding:0.5rem;
    }
    .download-link{
        margin-top:0.5rem;
        text-align:center;
    }
    .download-link a{
        color:var(--accent);
        text-decoration:none;
        font-weight:600;
    }
    .ad-slot{
        width:100%;
        max-width:728px;
        height:90px;
        background:#222;
        color:#777;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:0.9rem;
        margin:1rem 0;
        border-radius:var(--radius);
    }
    @media (max-width:600px){
        .ad-slot{
            height:60px;
            font-size:0.75rem;
        }
    }
</style>
</head>
<body>
    <div id="ad-slot-top" class="ad-slot">[Adsterra / Monetag – Top Banner Placeholder]</div>

    <h1>Free WiFi & URL QR Code Generator Pro</h1>

    <div class="container">
        <div class="input-group">
            <input type="text" id="url-input" placeholder="Enter URL (e.g. https://example.com)">
            <button id="generate-btn">Generate</button>
        </div>
        <div id="qr-output"></div>
        <div class="download-link" id="download-area" style="display:none;">
            <a href="#" id="download-link" download="qr-code.png">Download QR Code</a>
        </div>
    </div>

    <div id="ad-slot-bottom" class="ad-slot">[Adsterra / Monetag – Bottom Banner Placeholder]</div>

    <!-- QRCode.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
    (function(){
        const generateBtn = document.getElementById('generate-btn');
        const urlInput   = document.getElementById('url-input');
        const qrOutput   = document.getElementById('qr-output');
        const downloadArea = document.getElementById('download-area');
        const downloadLink = document.getElementById('download-link');
        let qrcode = null;

        function isValidUrl(string) {
            try { new URL(string); return true; }
            catch (_) { return false; }
        }

        function generateQR(text){
            // Clear previous QR if any
            qrOutput.innerHTML = '';
            qrcode = new QRCode(qrOutput, {
                text: text,
                width: 256,
                height: 256,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
            // Wait a bit for canvas rendering then set download link
            setTimeout(()=>{
                const canvas = qrOutput.querySelector('canvas');
                if(canvas){
                    const dataURL = canvas.toDataURL('image/png');
                    downloadLink.href = dataURL;
                    downloadArea.style.display = 'block';
                }
            }, 300);
        }

        generateBtn.addEventListener('click', ()=>{
            const url = urlInput.value.trim();
            if(!url){
                alert('Please enter a URL.');
                return;
            }
            const formattedUrl = url.startsWith('http://') || url.startsWith('https://') ? url : 'https://' + url;
            if(!isValidUrl(formattedUrl)){
                alert('Invalid URL format.');
                return;
            }
            generateQR(formattedUrl);
        });

        // Allow Enter key to trigger generation
        urlInput.addEventListener('keypress', e=>{
            if(e.key === 'Enter'){
                generateBtn.click();
            }
        });
    })();
    </script>
</body>
</html>
